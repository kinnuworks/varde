[project]
name = "varde"
version = "1.0.0"
description = "Evidence-first research agent for Norwegian companies: every fact tied to an organisation number, a source, a date and a quoted span."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<0.5",
  "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
varde = "varde.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
